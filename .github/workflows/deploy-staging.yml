name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main
        type: string
      skip_migrate:
        description: Skip prisma migrate deploy
        required: false
        default: false
        type: boolean
      force_dirty:
        description: Allow dirty working tree on the VPS
        required: false
        default: false
        type: boolean

# Manual only — do not auto-ship payments / matching writers on every push.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API to staging VPS
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Validate secrets
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          missing=0
          for name in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add STAGING_SSH_* secrets (see ops/deploy/README.md)." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          port="${STAGING_SSH_PORT:-22}"
          ssh-keyscan -p "$port" -H "$STAGING_SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_PORT=$port" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          GIT_REF: ${{ inputs.ref }}
          SKIP_MIGRATE: ${{ inputs.skip_migrate }}
          FORCE_DIRTY: ${{ inputs.force_dirty }}
        run: |
          set -euo pipefail
          case "$GIT_REF" in
            *[!A-Za-z0-9._/-]*|"") echo "Refused unsafe GIT_REF: $GIT_REF" >&2; exit 2 ;;
          esac

          ssh -i ~/.ssh/id_ed25519 \
            -p "${SSH_PORT}" \
            -o BatchMode=yes \
            "${STAGING_SSH_USER}@${STAGING_SSH_HOST}" \
            "GIT_REF=$(printf %q "$GIT_REF") SKIP_MIGRATE=$(printf %q "$SKIP_MIGRATE") FORCE_DIRTY=$(printf %q "$FORCE_DIRTY") bash -s" <<'REMOTE'
          set -euo pipefail
          APP=/var/www/cyrlo-ride-api/app
          git config --global --add safe.directory "$APP" || true
          cd "$APP"

          sudo -u cyrlo-ride -H bash -lc "cd '$APP' && git fetch origin && git checkout '$GIT_REF' && git pull --ff-only origin '$GIT_REF'"

          sed -i 's/\r$//' ops/deploy/deploy-staging.sh ops/deploy/smoke-staging.sh 2>/dev/null || true
          chmod +x ops/deploy/deploy-staging.sh ops/deploy/smoke-staging.sh

          EXTRA=(--skip-pull --ref "$GIT_REF")
          if [ "$SKIP_MIGRATE" = "true" ]; then
            EXTRA+=(--skip-migrate)
          fi
          if [ "$FORCE_DIRTY" = "true" ]; then
            EXTRA+=(--force-dirty)
          fi

          bash ops/deploy/deploy-staging.sh "${EXTRA[@]}"
          bash ops/deploy/smoke-staging.sh
          REMOTE

      - name: Post-deploy smoke (from runner)
        run: |
          curl -fsS -o /dev/null https://cyrloride.eqostack.com/api/v1/health
          curl -fsS -o /dev/null https://cyrloride.eqostack.com/api/v1/health/ready
          curl -fsS -o /dev/null https://eqostack.com/
          echo "public smoke OK"
